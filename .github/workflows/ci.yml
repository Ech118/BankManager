name: CI

# Lint plus the shared contract suite. Runs entirely in MODE=mock, so CI needs
# no API keys, no database and no network access.

on:
  push:
    branches: [main]
  pull_request:

env:
  MODE: mock
  LLM_MODE: mock

jobs:
  lint-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/contracts/requirements.txt
          python -m pip install ruff

      - name: Lint
        run: python -m ruff check .

      - name: Contract tests
        run: python -m pytest tests/contracts -q

      # The models are the source of truth; the committed JSON is generated.
      # This fails if someone edited schema/*.json by hand or forgot to run
      # `make gen-schema`.
      - name: Schemas match the models
        run: |
          python scripts/gen_schema.py
          git diff --exit-code schema/ \
            || (echo "::error::schema/*.json is out of date. Run 'make gen-schema' and commit." && exit 1)

      # Same idea for the ACME fixtures: they are generated and hand-checked,
      # never edited directly.
      - name: Fixtures match the generator
        run: |
          python scripts/gen_mock_fixtures.py
          git diff --exit-code fixtures/mock/ \
            || (echo "::error::fixtures/mock/ is out of date. Run 'make gen-mock' and commit." && exit 1)

      - name: Secret scan
        run: scripts/secret_scan.sh --all

  ownership:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Advisory only: a PR may legitimately be a contract change or a
      # coordinator commit. The partition owner still runs
      # `make check-ownership P=<theirs>` locally before pushing.
      - name: Report changed paths
        run: |
          echo "Files changed vs ${{ github.base_ref }}:"
          git diff --name-only "origin/${{ github.base_ref }}...HEAD"
          echo ""
          echo "Reviewers: confirm these sit inside one partition, or that the"
          echo "contract-change checklist in the PR body is complete."
